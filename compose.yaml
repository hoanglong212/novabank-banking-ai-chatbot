name: novabank-demo
services:
  bank:
    extends: {file: compose.agent.yaml, service: bank}
    environment:
      ENV: review
      JWT_SECRET: ${JWT_SECRET:?Set a persistent random JWT_SECRET}
      DB_PATH: /data/novabank_demo.sqlite3
      CORS_ORIGINS: https://${DEMO_DOMAIN:?Set your HTTPS hostname}
      FORWARDED_ALLOW_IPS: ${NOVABANK_PROXY_IP:-172.31.86.2}
    networks: [default, edge]
    volumes:
      - bank-data:/data
      - research-data:/app/.local/research
  agent:
    extends: {file: compose.agent.yaml, service: agent}
  ollama:
    extends: {file: compose.agent.yaml, service: ollama}
  models:
    extends: {file: compose.agent.yaml, service: models}
  proxy:
    image: caddy:2
    ports: ["0.0.0.0:80:80", "0.0.0.0:443:443", "0.0.0.0:443:443/udp"]
    networks:
      edge:
        ipv4_address: ${NOVABANK_PROXY_IP:-172.31.86.2}
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME contact email}
      DEMO_ALLOWED_NETWORKS: ${DEMO_ALLOWED_NETWORKS:?Set the trusted reviewer IP addresses or CIDRs}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      bank: {condition: service_healthy}
    restart: unless-stopped
  backup:
    build: .
    command: [python, /app/scripts/backup-loop.py]
    environment:
      DB_PATH: /data/novabank_demo.sqlite3
      BACKUP_KEY_FILE: /run/secrets/backup_key
    volumes:
      - bank-data:/data:ro
      - backup-data:/backups
    secrets: [backup_key]
    depends_on:
      bank: {condition: service_healthy}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
secrets:
  backup_key:
    file: ${BACKUP_KEY_FILE:?Set the separate backup key file path}
networks:
  edge:
    ipam:
      config:
        - subnet: ${NOVABANK_PROXY_SUBNET:-172.31.86.0/28}
volumes:
  bank-data:
    # Retain the existing hosted volume by default. Prepare it explicitly on a new host.
    external: true
    name: ${NOVABANK_SHARED_DATA_VOLUME:-novabank-demo_bank-data}
  ollama-models:
  research-data:
  backup-data:
  caddy-data:
  caddy-config:
