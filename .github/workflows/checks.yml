name: Banking checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  container-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      # A small real model verifies the deployment path within runner limits.
      OLLAMA_MODEL: qwen2.5:1.5b
      GUARD_MODEL: qwen2.5:1.5b
      QUARANTINED_LLM_MODEL: qwen2.5:1.5b
    steps:
      - uses: actions/checkout@v4
      - name: Validate restricted HTTPS configuration
        env:
          JWT_SECRET: ci-only-not-a-deployment-secret
          DEMO_DOMAIN: review.example.com
          ACME_EMAIL: operator@example.com
          DEMO_ALLOWED_NETWORKS: 192.0.2.10/32 198.51.100.0/24
          BACKUP_KEY_FILE: /dev/null
          NOVABANK_SHARED_DATA_VOLUME: novabank-ci-review-data
        run: |
          docker compose config --quiet
          docker volume create "$NOVABANK_SHARED_DATA_VOLUME"
          docker compose run --rm --no-deps proxy caddy validate --config /etc/caddy/Caddyfile
      - name: Build and start from a clean checkout
        run: docker compose -f compose.local.yaml up --build -d --wait --wait-timeout 360
      - name: Sign in and receive a real agent response
        run: python3 scripts/smoke-agent.py
      - name: Container diagnostics
        if: failure()
        run: docker compose -f compose.local.yaml logs --tail 80
      - name: Stop the test stack
        if: always()
        run: docker compose -f compose.local.yaml down
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Install CI-only lint tools
        run: python -m pip install ruff==0.14.3
      - name: Python correctness lint
        run: python -m ruff check backend/app agent_service research scripts tools
      - name: JavaScript correctness lint
        run: npm exec --yes --package=eslint@9.39.1 -- eslint --config eslint.config.mjs frontend/scripts
      - run: python -m compileall -q backend/app agent_service research scripts
      - run: python scripts/financial-coverage.py
      - run: python -m pytest research/tests -q
      - run: npm ci
        working-directory: frontend
      - run: npm run test:components
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-evidence
          path: |
            frontend/test-results/
            .local/full-roadmap/financial-coverage.json
          retention-days: 7
