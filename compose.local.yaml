# Self-contained workstation demo. Use compose.yaml for a restricted HTTPS review server.
name: novabank-local
services:
  bank:
    extends: {file: compose.agent.yaml, service: bank}
    image: novabank-bank:local
    ports: ["127.0.0.1:${NOVABANK_PORT:-8080}:8000"]
    environment:
      ENV: demo                      # enables the simulated inbox at /outbox
      DB_PATH: /data/novabank.sqlite3
      JWT_SECRET: ${JWT_SECRET:-}    # empty = random per start; set one in .env to keep sign-ins across restarts
    volumes: [bank-data:/data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
  agent:
    extends: {file: compose.agent.yaml, service: agent}
    image: novabank-agent:local
  ollama:
    extends: {file: compose.agent.yaml, service: ollama}
  models:
    extends: {file: compose.agent.yaml, service: models}
volumes:
  bank-data:
  ollama-models:
